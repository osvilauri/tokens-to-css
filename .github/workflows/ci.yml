name: CI

on:
  push:
    # Branch pushes are covered by the pull request they belong to; running
    # both would double every check for no extra signal.
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Maintenance LTS, Active LTS, Current — the lines `engines` claims.
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          # Goldens are never regenerated in CI (AD-17). A run that rewrites
          # its own expectations proves nothing.
          UPDATE_GOLDEN: ''

  changeset:
    # A release must be deliberate: every pull request that touches src/ or the
    # manifest declares its version impact, or says in writing that it has none.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: git fetch --no-tags --depth=1 origin "$BASE"
        env:
          BASE: ${{ github.base_ref }}
      - name: Every change declares its version impact
        run: |
          npx changeset status --since="origin/$BASE" || {
            echo
            echo "This pull request changes the package but declares no version impact."
            echo "Add one with:  npx changeset"
            echo "If the change genuinely has none (tests, docs, internal refactor),"
            echo "record that explicitly:  npx changeset --empty"
            exit 1
          }
        env:
          BASE: ${{ github.base_ref }}
