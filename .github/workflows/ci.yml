name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Maintenance LTS, Active LTS, Current — the lines `engines` claims.
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          # Goldens are never regenerated in CI (AD-17). A run that rewrites
          # its own expectations proves nothing.
          UPDATE_GOLDEN: ''

  changeset:
    # A release must be deliberate: every pull request that touches src/ or the
    # manifest declares its version impact, or says in writing that it has none.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx changeset status --since=origin/${{ github.base_ref }}
