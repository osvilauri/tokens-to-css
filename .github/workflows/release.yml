name: Release

on:
  push:
    branches: [main]

# There is no publishing token any more. `id-token: write` gives this workflow a
# short-lived, cryptographically signed identity that npm trusts because the
# package names this repository and this filename as a trusted publisher.
#
# Nothing long-lived to leak, rotate, or forget to revoke — and the credential
# cannot be extracted or replayed, because it is minted per run.
#
# Renaming this file breaks publishing until the trusted publisher is updated to
# match. That is the point: the filename is part of the identity.
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          # Required for OIDC: npm only looks for a trusted-publisher identity
          # when it knows which registry it is talking to.
          registry-url: https://registry.npmjs.org

      # OIDC needs npm 11.5.1 or newer, and staged publishing 11.15. Pinning it
      # explicitly rather than inheriting whatever Node happens to bundle keeps
      # the release from breaking on a Node patch release.
      - run: npm install -g npm@^11.15
      - run: npm --version

      - run: npm ci

      # The same gate as every other change. A release is not a reason to skip
      # the checks; it is the one moment they matter most.
      # Build before test, the same order as ci.yml. Some tests read the built
      # bundle — the one that proves no evaluator ships, among them — and the
      # first run of this workflow failed for exactly that reason.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: node bench/run.mjs

      # Refuses to publish while the public surface is still a placeholder.
      - run: npm run guard:unimplemented

      # Either opens a "Version Packages" pull request that consumes the
      # changesets, or — when that pull request has been merged and the version
      # is already bumped — publishes.
      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npx changeset publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          # GITHUB_TOKEN is for opening the version pull request, not for npm.
          # npm authenticates over OIDC, and publishes provenance by default
          # when it does — so no token and no --provenance flag.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
